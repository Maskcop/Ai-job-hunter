[project]
name = "ai-job-hunter"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "python-dotenv",
    "pypdf",
    "langchain",
    "langchain-community",
    "langchain-chroma",
    "langchain-google-genai",
    "langchain-text-splitters"
]

[tool.vercel]
entrypoint = "api:app"